lidar0:
    topic: /livox/lidar
    is_livox: true
    Extrinsics:  # lidar to imu:n100
        time_offset: 0.0
        Trans: [0.025325, 0.052099, 0.068090] #T1
        Rot:  [ 0.904961, 0.005940, 0.425453,
               -0.009338, 0.999939, 0.005902,
               -0.425392, -0.009314, 0.904961]
        # Trans: [-0.011,-0.02329,0.04412] # /livox/imu # T4 
        # Rot:  [ 1,0,0,
        #         0,1,0,
                # 0,0,1]
num_lidars: 1
lidar_timestamp_end: false  # if the timestamp of a lidar scan is set at the end of the scan

### FeatureExtraction ###
Livox:  # mid360
    n_scan: 4
    blind: 1.0
    group_size: 8
    point_filter_num: 4
    inf_bound: 4
    disA: 0.01
    disB: 0.1
    limit_maxmid: 6.25
    limit_midmin: 6.25
    limit_maxmin: 3.24
    p2l_ratio: 225
    jump_up_limit: 100
    jump_down_limit: 8.0
    edgea: 2
    edgeb: 0.1
    smallp_intersect: 172.5
    smallp_ratio: 1.2
    edge_threshold: 1.0
    surf_threshold: 0.1
    odometry_surface_leaf_size: 0.2
    min_distance: 1.0
    max_distance: 100

### Odometry ###
use_corner_feature: false
use_ivox: true # ikdtree ivox 精度与特征子图的分辨率正相关
ivox_filter_size_map_min: 0.5
current_scan_param:
    corner_leaf_size: 0.2
    surface_leaf_size: 0.5 #indoor 0.2
    edge_min_valid_num: 10
    surf_min_valid_num: 200
    correspondence_downsample: 1

keyframe_strategy:
    angle_degree: 10
    dist_meter: 1.0
    time_second: 10
    
map_param:    
    keyframe_search_radius: 35.0
    keyframe_search_time: 10.0
    keyframe_density: 0.5
    cloud_reserved_time: -1  # [s]